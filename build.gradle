plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// everything that differs between game versions comes from gradle.properties
def mc = project.property('mc').toString()
if (!project.property('supported').toString().split(',').contains(mc)) {
	throw new GradleException("no versions set for minecraft ${mc}, see gradle.properties")
}
def fabricApi = project.property("fabric_api_${mc}")
def (resourcefulArtifact, resourcefulVersion) = project.property("resourceful_config_${mc}").toString().split(':')

// jars are named filobulus-0.4.0+26.3.jar
version = "${project.version}+${mc}"

repositories {
	maven {
		name = 'Team Resourceful'
		url = 'https://maven.teamresourceful.com/repository/maven-public/'
	}
}

loom {
	// main = logic without minecraft classes, client = everything that touches the game
	splitEnvironmentSourceSets()

	mods {
		"filobulus" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets.client.java.srcDir "src/client-${project.property("compat_${mc}")}/java"

dependencies {
	minecraft "com.mojang:minecraft:${mc}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabricApi}"

	// include packs it inside our jar so players install nothing extra
	def resourcefulConfig = "com.teamresourceful.resourcefulconfig:resourcefulconfig-fabric-${resourcefulArtifact}:${resourcefulVersion}"
	implementation resourcefulConfig
	include resourcefulConfig

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def values = [version: project.version, minecraft: mc, resourceful_config: resourcefulVersion]
	inputs.properties values

	filesMatching("fabric.mod.json") {
		expand values
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

// one jar per supported game version, all of them end up in build/libs
def buildEach = project.property('supported').toString().split(',').collect { target ->
	tasks.register("build_${target}", GradleBuild) {
		group = 'build'
		buildName = "filobulus_${target.replace('.', '_')}"
		tasks = ['build']
		startParameter.projectProperties = [mc: target]
		notCompatibleWithConfigurationCache('runs a build of its own')
	}
}
for (int i = 1; i < buildEach.size(); i++) {
	def before = buildEach[i - 1]
	buildEach[i].configure { mustRunAfter before }
}
tasks.register('buildAll') {
	group = 'build'
	dependsOn buildEach
}

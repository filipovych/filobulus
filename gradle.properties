org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# check these on https://fabricmc.net/develop
loader_version=0.20.1
loom_version=1.19.5

# the game version to build for, -Pmc=26.2 picks another one and buildAll does all of them
mc=26.3
supported=26.1.2,26.2,26.3

fabric_api_26.1.2=0.155.3+26.1.2
fabric_api_26.2=0.161.0+26.2
fabric_api_26.3=0.166.2+26.3

# resourceful config has one version line per game version, written as artifact suffix:version
resourceful_config_26.1.2=26.1:4.0.1
resourceful_config_26.2=26.2:5.0.1
resourceful_config_26.3=26.3:6.0.2

# a few game calls were renamed in 26.2, src/client-<this> holds the code that differs
compat_26.1.2=26.1
compat_26.2=26.2
compat_26.3=26.2

# mod
version=0.4.0
group=io.github.filipovych

# tests
junit_version=6.1.3
